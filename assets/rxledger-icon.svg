<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B30FF"/>
      <stop offset="100%" stop-color="#4D7CFF"/>
    </linearGradient>
  </defs>

  <!-- Capsule/Pill shape (vertical, outline style) -->
  <path
    d="M50,10 C36,10 25,21 25,35 L25,60 C25,74 36,85 50,85 C64,85 75,74 75,60 L75,35 C75,21 64,10 50,10 Z"
    fill="none"
    stroke="url(#pillGrad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Horizontal divider line through the capsule center -->
  <line
    x1="25" y1="47.5"
    x2="75" y2="47.5"
    stroke="url(#pillGrad)"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Plus sign (+) to the right of capsule -->
  <line x1="84" y1="22" x2="84" y2="38" stroke="#9B30FF" stroke-width="5" stroke-linecap="round"/>
  <line x1="76" y1="30" x2="92" y2="30" stroke="#9B30FF" stroke-width="5" stroke-linecap="round"/>
</svg>
